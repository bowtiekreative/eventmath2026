<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventMath Playground</title>
<style>
/* ── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #1a1a2e;
  --bg-panel:     #16213e;
  --bg-editor:    #0d1117;
  --border:       #0f3460;
  --accent-red:   #e94560;
  --accent-blue:  #4fc3f7;
  --accent-green: #69f0ae;
  --accent-orange:#ffb74d;
  --accent-purple:#ce93d8;
  --text-primary: #e0e0e0;
  --text-muted:   #8b949e;
  --text-code:    #c9d1d9;
  --btn-primary:  #0f3460;
  --btn-hover:    #1a4a8a;
  --btn-secondary:#1e2a3a;
  --scrollbar:    #0f3460;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  overflow: hidden;
}

/* ── Header ──────────────────────────────────────────── */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}

#header h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
  white-space: nowrap;
  margin-right: 4px;
}

#header h1 span {
  color: var(--text-muted);
  font-weight: 400;
}

.header-spacer { flex: 1; }

#examples-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

#example-select {
  background: var(--bg-editor);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
#example-select:hover { border-color: var(--accent-blue); }

.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  outline: none;
  position: relative;
}

.btn-primary {
  background: var(--btn-primary);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.btn-primary:hover {
  background: var(--btn-hover);
  box-shadow: 0 0 12px rgba(79,195,247,0.3);
}

.btn-secondary {
  background: var(--btn-secondary);
  border-color: var(--border);
  color: var(--text-primary);
}
.btn-secondary:hover {
  background: #253040;
  border-color: var(--accent-blue);
}

/* Modified dot on button */
.btn .modified-dot {
  display: none;
  width: 6px; height: 6px;
  background: var(--accent-orange);
  border-radius: 50%;
  position: absolute;
  top: 4px; right: 4px;
}
.btn.modified .modified-dot { display: block; }

/* Status tag */
#status-tag {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.2s;
}
#status-tag.ready   { background: #1e2a1e; color: var(--accent-green); border: 1px solid #2a4a2a; }
#status-tag.compiled{ background: #1a2a3e; color: var(--accent-blue);  border: 1px solid var(--border); }
#status-tag.error   { background: #2e1a1e; color: var(--accent-red);   border: 1px solid #4a1a1a; }
#status-tag.running { background: #1e2a1e; color: var(--accent-orange); border: 1px solid #3a3a1a; animation: pulse 1s ease-in-out infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* ── Main Layout ─────────────────────────────────────── */
#main {
  display: flex;
  height: 100vh;
  padding-top: 52px;
}

/* ── Left Column — Source Editor ─────────────────────── */
#left-col {
  width: 40%;
  min-width: 280px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg-editor);
}

#editor-header {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}

#editor-header .panel-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
}

#editor-header .shortcut-hint {
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-editor);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  margin-left: auto;
}

/* Editor wrapper with line numbers */
#editor-wrapper {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

#line-numbers {
  width: 40px;
  min-width: 40px;
  background: var(--bg-editor);
  border-right: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.5;
  padding: 12px 6px 12px 0;
  text-align: right;
  user-select: none;
  overflow: hidden;
  pointer-events: none;
}

#source-editor {
  flex: 1;
  width: 100%;
  background: var(--bg-editor);
  color: var(--text-code);
  border: none;
  outline: none;
  resize: none;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.5;
  padding: 12px 12px 12px 10px;
  tab-size: 2;
  scrollbar-color: var(--scrollbar) transparent;
}
#source-editor::placeholder { color: var(--text-muted); }
#source-editor:focus { outline: none; }

/* Error line highlight */
.error-line-highlight {
  background: rgba(233,69,96,0.12);
}

/* ── Right Column ────────────────────────────────────── */
#right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ── Panel Shared ────────────────────────────────────── */
.panel {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: center;
  padding: 7px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex-shrink: 0;
}

.panel-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.panel-tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  font-weight: 600;
}
.tag-js     { background: #1a2a1e; color: var(--accent-green); border: 1px solid #2a4a2a; }
.tag-output { background: #1a1a2e; color: var(--accent-blue);  border: 1px solid var(--border); }
.tag-visual { background: #2a1a2e; color: var(--accent-purple); border: 1px solid #3a1a3e; }

.panel-body {
  flex: 1;
  overflow: auto;
  padding: 10px 12px;
  scrollbar-color: var(--scrollbar) transparent;
}

/* ── Compiled JS Panel (~35%) ─────────────────────────── */
#panel-compiled { flex: 35; }

#compiled-output {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-code);
  white-space: pre;
  tab-size: 2;
}

/* Syntax highlight colors */
.sh-keyword  { color: #ff7b72; }
.sh-string   { color: #a5d6ff; }
.sh-comment  { color: var(--text-muted); font-style: italic; }
.sh-number   { color: var(--accent-orange); }
.sh-function { color: #d2a8ff; }
.sh-const    { color: #79c0ff; }

/* ── Console Panel (~25%) ─────────────────────────────── */
#panel-console { flex: 25; }

#console-output {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-code);
  white-space: pre-wrap;
  word-break: break-all;
}

.console-line-normal { color: var(--text-code); }
.console-line-error  { color: var(--accent-red); }
.console-line-divider {
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  padding-top: 6px;
  margin-top: 4px;
}

/* ── Timeline Visualization Panel (~40%) ─────────────── */
#panel-timeline { flex: 40; border-bottom: none; }

#timeline-output {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Event card */
.em-card {
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  border: 1px solid;
  transition: all 0.2s ease;
}
.em-card:hover {
  transform: translateX(2px);
  filter: brightness(1.1);
}

.em-card-event {
  background: #0d1a2e;
  border-color: #1a4a6a;
}
.em-card-layer {
  background: #0d1e15;
  border-color: #1a4a2a;
}
.em-card-timeline {
  background: #1e1a0d;
  border-color: #4a3a1a;
}

.em-card-icon {
  display: inline-block;
  width: 18px; height: 18px;
  border-radius: 50%;
  text-align: center;
  line-height: 18px;
  font-size: 10px;
  margin-right: 8px;
  vertical-align: middle;
}
.icon-event    { background: #1a4a6a; color: var(--accent-blue); }
.icon-layer    { background: #1a4a2a; color: var(--accent-green); }
.icon-timeline { background: #4a3a1a; color: var(--accent-orange); }

.em-card-name {
  font-weight: 600;
  font-size: 13px;
  vertical-align: middle;
}
.em-card-event .em-card-name    { color: var(--accent-blue); }
.em-card-layer .em-card-name    { color: var(--accent-green); }
.em-card-timeline .em-card-name { color: var(--accent-orange); }

.em-card-fields {
  margin-top: 6px;
  padding-left: 26px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
}

.em-field {
  font-size: 11px;
  color: var(--text-muted);
}
.em-field-key   { color: var(--accent-purple); }
.em-field-value { color: var(--text-primary); }

/* Timeline scrubber */
.em-timeline-scrubber {
  margin-top: 10px;
  padding-left: 26px;
}

.scrubber-track {
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
  margin-bottom: 8px;
}

.scrubber-rail {
  position: absolute;
  left: 0; right: 0;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
}

.scrubber-fill {
  position: absolute;
  left: 0;
  height: 3px;
  background: var(--accent-orange);
  border-radius: 2px;
  transition: width 0.2s;
}

.scrubber-dots {
  position: absolute;
  left: 0; right: 0;
  display: flex;
  align-items: center;
}

.scrubber-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  border: 2px solid var(--bg-deep);
  transition: all 0.2s;
  cursor: pointer;
  flex-shrink: 0;
}
.scrubber-dot.past    { background: var(--text-muted); }
.scrubber-dot.present { background: var(--accent-orange); box-shadow: 0 0 8px var(--accent-orange); }
.scrubber-dot.future  { background: var(--border); }

.scrubber-input {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  height: 4px;
  background: transparent;
  position: relative;
  z-index: 2;
  cursor: pointer;
}
.scrubber-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent-orange);
  border: 2px solid var(--bg-deep);
  box-shadow: 0 0 6px rgba(255,183,77,0.5);
  cursor: pointer;
  transition: transform 0.1s;
}
.scrubber-input::-webkit-slider-thumb:hover { transform: scale(1.3); }
.scrubber-input::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent-orange);
  border: 2px solid var(--bg-deep);
  cursor: pointer;
}

.scrubber-info {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.scrubber-position { color: var(--accent-orange); font-weight: 600; }

.scrubber-state {
  margin-top: 8px;
  background: rgba(0,0,0,0.2);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 11px;
  line-height: 1.7;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  color: var(--text-muted);
  max-height: 80px;
  overflow: auto;
}

.scrubber-event-past    { color: var(--text-muted); }
.scrubber-event-present { color: var(--accent-orange); font-weight: 600; }

/* Empty state */
.empty-state {
  color: var(--text-muted);
  font-size: 12px;
  font-style: italic;
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}

/* Errors */
.error-block {
  background: #2e0d0d;
  border: 1px solid var(--accent-red);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--accent-red);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  white-space: pre-wrap;
}

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }

/* ── Mobile ───────────────────────────────────────────── */
@media (max-width: 700px) {
  html, body { overflow: auto; }
  #main { flex-direction: column; height: auto; }
  #left-col { width: 100%; height: 50vh; min-height: 260px; }
  #right-col { height: auto; }
  #panel-compiled,#panel-console,#panel-timeline { flex: none; height: 220px; }
  body { overflow: auto; }
}
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────── -->
<div id="header">
  <h1>EventMath <span>Playground</span></h1>

  <label id="examples-label" for="example-select">Examples</label>
  <select id="example-select">
    <option value="0">Game Score</option>
    <option value="1">Requirements Tracker</option>
    <option value="2">Reading Tracker</option>
    <option value="3">Content Filter</option>
    <option value="4">Overlap Demo</option>
  </select>

  <div class="header-spacer"></div>

  <button id="btn-compile-run" class="btn btn-primary" title="Compile and run (Cmd/Ctrl+Enter)">
    Compile &amp; Run
    <span class="modified-dot"></span>
  </button>
  <button id="btn-compile-only" class="btn btn-secondary">Compile only</button>

  <span id="status-tag" class="ready">Ready</span>
</div>

<!-- ── Main ───────────────────────────────────────────── -->
<div id="main">

  <!-- Left: Source Editor -->
  <div id="left-col">
    <div id="editor-header">
      <span class="panel-label">EventMath Source</span>
      <span id="editor-hint" class="shortcut-hint">&#8984;&#8629; Run</span>
    </div>
    <div id="editor-wrapper">
      <div id="line-numbers">1</div>
      <textarea id="source-editor" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="Write EventMath here..."></textarea>
    </div>
  </div>

  <!-- Right: Three stacked panels -->
  <div id="right-col">

    <!-- Panel 1: Compiled JS -->
    <div class="panel" id="panel-compiled">
      <div class="panel-header">
        <span class="panel-label">Compiled JavaScript</span>
        <span class="panel-tag tag-js">JS</span>
      </div>
      <div class="panel-body">
        <div id="compiled-output"><span class="empty-state">Compiled output will appear here.</span></div>
      </div>
    </div>

    <!-- Panel 2: Console Output -->
    <div class="panel" id="panel-console">
      <div class="panel-header">
        <span class="panel-label">Console Output</span>
        <span class="panel-tag tag-output">LOG</span>
      </div>
      <div class="panel-body">
        <div id="console-output"><span class="empty-state">Run output will appear here.</span></div>
      </div>
    </div>

    <!-- Panel 3: Timeline Visualization -->
    <div class="panel" id="panel-timeline">
      <div class="panel-header">
        <span class="panel-label">Timeline Visualization</span>
        <span class="panel-tag tag-visual">VISUAL</span>
      </div>
      <div class="panel-body">
        <div id="timeline-output"><span class="empty-state">Events, layers, and timelines will appear here after running.</span></div>
      </div>
    </div>

  </div>
</div>

<!-- ── Compiler Bundle ────────────────────────────────── -->
<script src="eventmath-browser.js"></script>

<!-- ── Playground Logic ──────────────────────────────── -->
<script>
(function () {
  'use strict';

  // ── Example Programs ──────────────────────────────────

  var EXAMPLES = [
    {
      name: 'Game Score',
      source: `# Game Score Tracker
note A score tracker where every point earned is an event

event level complete
category achievement
matter
  description is Player completed the first level
  points is 100
end
end

event boss defeated
category achievement
matter
  description is Player defeated the main boss
  points is 250
end
end

event bonus collected
category achievement
matter
  description is Player found the hidden bonus
  points is 50
end
end

layer player achievements
  level complete
  boss defeated
  bonus collected
end

timeline game session

present
  player achievements
end

end

mark base score as 350
mark bonus points as 50

set base score to base score plus bonus points

when base score is greater than 300
  run event level complete
  run event boss defeated
end

run layer player achievements
run game session present`
    },
    {
      name: 'Requirements Tracker',
      source: `# Requirements Tracker
note Requirements as events, organized into layers

action make requirement
door open title priority

event made requirement
category requirement
matter
  title from title
  priority from priority
  status is todo
end
end

door closed made requirement
end

layer current sprint
end

event login task
category requirement
matter
  title is User can log in
  priority is high
  status is in progress
end
end

event signup task
category requirement
matter
  title is User can create account
  priority is high
  status is done
end
end

add event login task into current sprint
add event signup task into current sprint

make requirement with title is User can reset password and priority is medium

run event login task
run event signup task
run layer current sprint`
    },
    {
      name: 'Reading Tracker',
      source: `# Reading Progress Tracker
note Track books finished as events on a timeline

event hobbit finished
category reading milestone
matter
  title is The Hobbit
  pages is 310
  rating is loved it
end
end

event wrinkle finished
category reading milestone
matter
  title is A Wrinkle in Time
  pages is 218
  rating is really good
end
end

event giver finished
category reading milestone
matter
  title is The Giver
  pages is 179
  rating is important and moving
end
end

layer reading list
  hobbit finished
  wrinkle finished
  giver finished
end

timeline reading year

present
  reading list
end

end

mark pages read as 0
mark goal pages as 500
mark books finished as 3

set pages read to 310
set pages read to pages read plus 218
set pages read to pages read plus 179

check books finished is greater than 2
check pages read is greater than goal pages

when pages read is greater than goal pages
  run event hobbit finished
  run reading year present
otherwise
  broken event reading goal not met
  matter
    pages so far is 707
    pages needed is 500
  end
  end
end`
    },
    {
      name: 'Content Filter',
      source: `# Content Filter
note Every message is an event; compound conditions route it

event welcome message
category message
matter
  text is Welcome to EventMath
  sender is system
  type is info
end
end

event error report
category message
matter
  text is Error in action make requirement
  sender is compiler
  type is error
end
end

event user question
category message
matter
  text is How do I create a timeline
  sender is user
  type is question
end
end

layer inbox
  welcome message
  error report
  user question
end

timeline message feed

present
  inbox
end

end

mark filter active as true
mark error count as 0

walk inbox as current message
  when current message type is error and filter active is true
    set error count to error count plus 1
    run current message
  end
  when current message type is info or current message type is question
    run current message
  end
end

check error count is at most 5
run message feed present`
    },
    {
      name: 'Overlap Demo',
      source: `# Overlap Demo
note Two event streams running in parallel

event stream a started
category system
matter
  source is stream alpha
  priority is high
end
end

event stream b started
category system
matter
  source is stream beta
  priority is medium
end
end

event streams merged
category system
matter
  result is both streams complete
  status is success
end
end

layer alpha track
  stream a started
end

layer beta track
  stream b started
end

timeline parallel run

present
  alpha track
  beta track
end

end

overlap
  run event stream a started
  run layer alpha track
and
  run event stream b started
  run layer beta track
end

run event streams merged
run parallel run present`
    }
  ];

  // ── DOM References ─────────────────────────────────────

  var sourceEditor   = document.getElementById('source-editor');
  var lineNumbers    = document.getElementById('line-numbers');
  var compiledOutput = document.getElementById('compiled-output');
  var consoleOutput  = document.getElementById('console-output');
  var timelineOutput = document.getElementById('timeline-output');
  var exampleSelect  = document.getElementById('example-select');
  var btnCompileRun  = document.getElementById('btn-compile-run');
  var btnCompileOnly = document.getElementById('btn-compile-only');
  var statusTag      = document.getElementById('status-tag');

  var _modified = false;
  var _lastCompiledJs = '';

  // ── Status helper ──────────────────────────────────────

  function setStatus(state, text) {
    statusTag.className = state;
    statusTag.textContent = text || state.charAt(0).toUpperCase() + state.slice(1);
  }

  // ── Line numbers ───────────────────────────────────────

  function updateLineNumbers() {
    var lines = sourceEditor.value.split('\n').length;
    var nums = [];
    for (var i = 1; i <= lines; i++) nums.push(i);
    lineNumbers.textContent = nums.join('\n');
    // Sync scroll
    lineNumbers.scrollTop = sourceEditor.scrollTop;
  }

  sourceEditor.addEventListener('input', function () {
    updateLineNumbers();
    if (!_modified) {
      _modified = true;
      btnCompileRun.classList.add('modified');
    }
  });

  sourceEditor.addEventListener('scroll', function () {
    lineNumbers.scrollTop = sourceEditor.scrollTop;
  });

  // Tab key support
  sourceEditor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var start = this.selectionStart;
      var end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      updateLineNumbers();
    }
    // Cmd/Ctrl + Enter
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      compileAndRun();
    }
  });

  // ── Examples ───────────────────────────────────────────

  function loadExample(idx) {
    var ex = EXAMPLES[idx];
    if (!ex) return;
    sourceEditor.value = ex.source;
    updateLineNumbers();
    _modified = false;
    btnCompileRun.classList.remove('modified');
    compileAndRun();
  }

  exampleSelect.addEventListener('change', function () {
    loadExample(parseInt(this.value, 10));
  });

  // ── Syntax Highlighter (minimal, no external deps) ─────

  function syntaxHighlight(code) {
    // Escape HTML first
    code = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Comments
    code = code.replace(/(\/\/[^\n]*)/g, '<span class="sh-comment">$1</span>');

    // Strings (careful not to match inside comments)
    code = code.replace(/"((?:[^"\\]|\\.)*)"/g, '<span class="sh-string">"$1"</span>');
    code = code.replace(/'((?:[^'\\]|\\.)*)'/g, '<span class="sh-string">\'$1\'</span>');

    // Keywords
    var keywords = ['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'switch', 'case', 'break', 'async', 'await', 'new', 'of', 'in', 'typeof', 'undefined', 'true', 'false', 'null'];
    keywords.forEach(function (kw) {
      code = code.replace(new RegExp('\\b(' + kw + ')\\b', 'g'), '<span class="sh-keyword">$1</span>');
    });

    // Numbers (after keywords to avoid double-wrapping)
    code = code.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="sh-number">$1</span>');

    // Function names (word followed by open paren)
    code = code.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)\s*(?=\()/g, function (m, fn) {
      // Don't re-wrap already-wrapped keywords
      return '<span class="sh-function">' + fn + '</span>';
    });

    return code;
  }

  // ── Console Capture ────────────────────────────────────

  var _capturedLines = [];

  function captureConsole(fn) {
    _capturedLines = [];
    var origLog = console.log;
    var origErr = console.error;

    console.log = function () {
      var msg = Array.from(arguments).map(String).join(' ');
      _capturedLines.push({ text: msg, kind: 'normal' });
      origLog.apply(console, arguments);
    };

    console.error = function () {
      var msg = Array.from(arguments).map(String).join(' ');
      _capturedLines.push({ text: msg, kind: 'error' });
      origErr.apply(console, arguments);
    };

    try {
      fn();
    } catch (e) {
      _capturedLines.push({ text: 'Runtime error: ' + e.message, kind: 'error' });
    } finally {
      console.log = origLog;
      console.error = origErr;
    }

    return _capturedLines;
  }

  // ── Execute compiled JS ────────────────────────────────

  function executeJs(js) {
    // For browser execution: comment out the require line so it falls through
    // to the already-loaded global EventMathRuntime
    var safeJs = js.replace(
      /^\s*:\s*require\(['"]\.\.\//mg,
      '  : /* browser: runtime loaded globally */ (function(){return null;})()//'
    );
    // More targeted: replace the require line in the EM declaration block
    safeJs = safeJs.replace(
      /\n(\s*:\s*require\(['"]\.\.[/\\]runtime[/\\]eventmath-runtime\.js['"]\);)/,
      '\n$1 // (overridden by browser globals)'
    );

    // Reset the defaultTimeline between runs
    // We can't directly access it, but we re-expose runtime globals each time
    // Just execute with Function to get isolated scope
    return captureConsole(function () {
      /* jshint evil: true */
      var runner = new Function(safeJs); // eslint-disable-line no-new-func
      runner();
    });
  }

  // ── Parse console output for visual rendering ──────────

  function parseConsoleForVisualization(lines) {
    var items = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i].text;
      var kind = lines[i].kind;

      // Event block: starts with "── Event: <name> ──"
      if (/^── Event: .+ ──$/.test(line)) {
        var eventName = line.replace(/^── Event: /, '').replace(/ ──$/, '');
        var fields = [];
        var category = '';
        i++;
        while (i < lines.length && !/^──/.test(lines[i].text)) {
          var fl = lines[i].text.trim();
          if (fl.startsWith('Category: ')) {
            category = fl.replace('Category: ', '');
          } else if (fl.includes(': ')) {
            var colonIdx = fl.indexOf(': ');
            fields.push({ key: fl.slice(0, colonIdx), value: fl.slice(colonIdx + 2) });
          }
          i++;
        }
        items.push({ kind: 'event', name: eventName, category: category, fields: fields });
        continue;
      }

      // Layer block: "── Layer: <name> ──"
      if (/^── Layer: .+ ──$/.test(line)) {
        var layerName = line.replace(/^── Layer: /, '').replace(/ ──$/, '');
        var events = [];
        i++;
        while (i < lines.length && !/^──/.test(lines[i].text)) {
          var ll = lines[i].text.trim();
          var m = ll.match(/^\[(\d+)\]\s+(.+)/);
          if (m) events.push(m[2]);
          i++;
        }
        items.push({ kind: 'layer', name: layerName, events: events });
        continue;
      }

      // Timeline block: "── Timeline: <name> ──"
      if (/^── Timeline: .+ ──$/.test(line)) {
        var tlName = line.replace(/^── Timeline: /, '').replace(/ ──$/, '');
        var pointer = 0, total = 0, tlEvents = [], marks = {};
        i++;
        while (i < lines.length && !/^──/.test(lines[i].text)) {
          var tl = lines[i].text.trim();
          var pm = tl.match(/^Pointer: (\d+) \/ (\d+)/);
          if (pm) { pointer = parseInt(pm[1]); total = parseInt(pm[2]); }
          var em2 = tl.match(/^Event: (.+) \[(.+)\]/);
          if (em2) tlEvents.push({ name: em2[1], cat: em2[2] });
          var mm = tl.match(/^(.+) = (.+)/);
          if (mm) marks[mm[1]] = mm[2];
          i++;
        }
        items.push({ kind: 'timeline', name: tlName, pointer: pointer, total: total, events: tlEvents, marks: marks });
        continue;
      }

      // Error lines
      if (kind === 'error') {
        items.push({ kind: 'error', text: line });
      }

      i++;
    }

    return items;
  }

  // ── Render visualization items ─────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderVisualization(items) {
    if (!items || items.length === 0) {
      timelineOutput.innerHTML = '<span class="empty-state">No visual output. Use "run event", "run layer", or "run timeline" in your program.</span>';
      return;
    }

    var html = '';

    items.forEach(function (item, idx) {
      if (item.kind === 'event') {
        html += '<div class="em-card em-card-event">';
        html += '<span class="em-card-icon icon-event">E</span>';
        html += '<span class="em-card-name">' + escHtml(item.name) + '</span>';
        if (item.category) {
          html += ' &nbsp;<span class="em-field"><span class="em-field-key">category</span> <span class="em-field-value">' + escHtml(item.category) + '</span></span>';
        }
        if (item.fields && item.fields.length > 0) {
          html += '<div class="em-card-fields">';
          item.fields.forEach(function (f) {
            html += '<span class="em-field"><span class="em-field-key">' + escHtml(f.key) + '</span>: <span class="em-field-value">' + escHtml(f.value) + '</span></span>';
          });
          html += '</div>';
        }
        html += '</div>';
      } else if (item.kind === 'layer') {
        html += '<div class="em-card em-card-layer">';
        html += '<span class="em-card-icon icon-layer">L</span>';
        html += '<span class="em-card-name">' + escHtml(item.name) + '</span>';
        html += ' &nbsp;<span class="em-field"><span class="em-field-key">' + item.events.length + ' events</span></span>';
        if (item.events.length > 0) {
          html += '<div class="em-card-fields">';
          item.events.forEach(function (e, i) {
            html += '<span class="em-field"><span class="em-field-key">' + (i + 1) + '</span> <span class="em-field-value">' + escHtml(e) + '</span></span>';
          });
          html += '</div>';
        }
        html += '</div>';
      } else if (item.kind === 'timeline') {
        var scrubId = 'scrubber-' + idx;
        var fillId = 'fill-' + idx;
        var stateId = 'state-' + idx;

        html += '<div class="em-card em-card-timeline">';
        html += '<span class="em-card-icon icon-timeline">T</span>';
        html += '<span class="em-card-name">' + escHtml(item.name) + '</span>';

        var total = Math.max(item.total, item.events.length, 1);
        var pointer = Math.min(item.pointer, total);

        html += ' &nbsp;<span class="em-field"><span class="em-field-key">' + pointer + '/' + total + ' entries</span></span>';

        // Events list in card
        if (item.events.length > 0) {
          html += '<div class="em-card-fields">';
          item.events.forEach(function (e) {
            html += '<span class="em-field"><span class="em-field-key">event</span> <span class="em-field-value">' + escHtml(e.name) + '</span></span>';
          });
          html += '</div>';
        }

        // Scrubber
        html += '<div class="em-timeline-scrubber">';
        html += '<div class="scrubber-track">';
        html += '<div class="scrubber-rail"></div>';
        html += '<div class="scrubber-fill" id="' + fillId + '" style="width:' + (total > 0 ? (pointer / total * 100) : 0) + '%"></div>';
        html += '<input type="range" class="scrubber-input" id="' + scrubId + '"';
        html += ' min="0" max="' + total + '" value="' + pointer + '"';
        html += ' data-timeline-idx="' + idx + '"';
        html += ' data-events=\'' + JSON.stringify(item.events) + '\'';
        html += ' data-total="' + total + '">';
        html += '</div>';
        html += '<div class="scrubber-info">';
        html += '<span>Position: <span class="scrubber-position" id="pos-' + idx + '">' + pointer + '</span> / ' + total + '</span>';
        html += '</div>';
        html += '<div class="scrubber-state" id="' + stateId + '">';
        html += renderScrubberState(item.events, pointer, total);
        html += '</div>';
        html += '</div>';

        // Marks
        if (item.marks && Object.keys(item.marks).length > 0) {
          html += '<div class="em-card-fields" style="margin-top:8px">';
          Object.keys(item.marks).forEach(function (k) {
            html += '<span class="em-field"><span class="em-field-key">' + escHtml(k) + '</span> = <span class="em-field-value">' + escHtml(item.marks[k]) + '</span></span>';
          });
          html += '</div>';
        }

        html += '</div>';
      } else if (item.kind === 'error') {
        html += '<div class="error-block">' + escHtml(item.text) + '</div>';
      }
    });

    timelineOutput.innerHTML = html;

    // Wire up scrubbers
    document.querySelectorAll('.scrubber-input').forEach(function (slider) {
      slider.addEventListener('input', function () {
        var idx2 = parseInt(this.getAttribute('data-timeline-idx'));
        var events = JSON.parse(this.getAttribute('data-events'));
        var total2 = parseInt(this.getAttribute('data-total'));
        var pos = parseInt(this.value);

        var fillEl = document.getElementById('fill-' + idx2);
        var stateEl = document.getElementById('state-' + idx2);
        var posEl = document.getElementById('pos-' + idx2);

        if (fillEl) fillEl.style.width = (total2 > 0 ? (pos / total2 * 100) : 0) + '%';
        if (posEl) posEl.textContent = pos;
        if (stateEl) stateEl.innerHTML = renderScrubberState(events, pos, total2);
      });
    });
  }

  function renderScrubberState(events, pointer, total) {
    if (!events || events.length === 0) {
      return '<span style="color:var(--text-muted)">No events recorded</span>';
    }

    // Map position to event index
    // The total = log.length (which includes events added via .log.push)
    // We show which events are "past" vs "present" (at pointer position)
    var scale = total > 0 ? events.length / total : 1;
    var currentEventIdx = Math.floor(pointer * scale) - 1;

    var parts = events.map(function (e, i) {
      var cls = i <= currentEventIdx ? 'scrubber-event-past' : 'scrubber-event-future';
      if (i === currentEventIdx) cls = 'scrubber-event-present';
      var arrow = i <= currentEventIdx ? '&#x25C6;' : '&#x25C7;';
      return '<span class="' + cls + '">' + arrow + ' ' + escHtml(e.name) + '</span>';
    });

    return parts.join('\n');
  }

  // ── Compile ────────────────────────────────────────────

  function compile() {
    var source = sourceEditor.value.trim();
    if (!source) {
      setStatus('ready', 'Ready');
      compiledOutput.innerHTML = '<span class="empty-state">Compiled output will appear here.</span>';
      return null;
    }

    setStatus('running', 'Compiling...');

    var result;
    try {
      result = window.EventMathCompiler.compile(source);
    } catch (e) {
      result = { js: '', errors: [e.message] };
    }

    if (result.errors && result.errors.length > 0) {
      setStatus('error', 'Error');
      compiledOutput.innerHTML = '<div class="error-block">' + result.errors.map(escHtml).join('\n') + '</div>';
      return null;
    }

    setStatus('compiled', 'Compiled');
    compiledOutput.innerHTML = '<pre id="compiled-pre" style="margin:0;padding:0;background:none;border:none">' + syntaxHighlight(result.js) + '</pre>';

    _modified = false;
    _lastCompiledJs = result.js;
    btnCompileRun.classList.remove('modified');

    return result.js;
  }

  function compileAndRun() {
    var js = compile();
    if (!js) return;

    setStatus('running', 'Running...');

    var lines = executeJs(js);

    // Render console output
    if (lines.length === 0) {
      consoleOutput.innerHTML = '<span class="empty-state">(no output — add "run event" or "run layer" statements)</span>';
    } else {
      var consoleHtml = lines.map(function (l) {
        var cls = l.kind === 'error' ? 'console-line-error' : 'console-line-normal';
        return '<div class="' + cls + '">' + escHtml(l.text) + '</div>';
      }).join('');
      consoleOutput.innerHTML = consoleHtml;
    }

    // Render visualization
    var vizItems = parseConsoleForVisualization(lines);
    renderVisualization(vizItems);

    setStatus('compiled', 'Ready');
  }

  // ── Button handlers ────────────────────────────────────

  btnCompileRun.addEventListener('click', compileAndRun);
  btnCompileOnly.addEventListener('click', compile);

  // ── Keyboard shortcut ──────────────────────────────────

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      compileAndRun();
    }
  });

  // ── Detect macOS for hint text ─────────────────────────

  (function () {
    var hint = document.getElementById('editor-hint');
    if (hint) {
      var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
      hint.textContent = isMac ? '⌘↵ Run' : 'Ctrl+↵ Run';
    }
  })();

  // ── Auto-load first example on start ──────────────────

  loadExample(0);

})();
</script>
</body>
</html>
